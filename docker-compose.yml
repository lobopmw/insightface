
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: insightface_postgres
    restart: always
    environment:
      POSTGRES_DB: insightface_db
      POSTGRES_USER: insightface_user
      POSTGRES_PASSWORD: insightface_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - insightface_network

  app:
    build: .
    container_name: insightface_app
    depends_on:
      - db
      - relay
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: insightface_db
      DB_USER: insightface_user
      DB_PASSWORD: insightface_password
      RELAY_HOST: relay
      RELAY_PORT: ${RELAY_PORT:-5555}
      RELAY_HTTP_PORT: ${RELAY_HTTP_PORT:-8555}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    ports:
      - "8501:8501"
    gpus: all
    networks:
      - insightface_network
    volumes:
      - .:/app
      - insightface_model_cache:/root/.insightface

  relay:
    build: .
    container_name: insightface_relay
    command:
      - python
      - src/relay_rtsp_server.py
      - ${RTSP_URL?Defina RTSP_URL no arquivo .env}
      - --host
      - 0.0.0.0
      - --port
      - ${RELAY_PORT:-5555}
      - --http-port
      - ${RELAY_HTTP_PORT:-8555}
      - --quality
      - ${RELAY_QUALITY:-85}
      - --send-fps
      - ${RELAY_SEND_FPS:-15}
    environment:
      RTSP_URL: ${RTSP_URL?Defina RTSP_URL no arquivo .env}
      RELAY_PORT: ${RELAY_PORT:-5555}
      RELAY_HTTP_PORT: ${RELAY_HTTP_PORT:-8555}
      RELAY_QUALITY: ${RELAY_QUALITY:-85}
      RELAY_SEND_FPS: ${RELAY_SEND_FPS:-15}
    ports:
      - "${RELAY_PORT:-5555}:${RELAY_PORT:-5555}"
      - "${RELAY_HTTP_PORT:-8555}:${RELAY_HTTP_PORT:-8555}"
    networks:
      - insightface_network
    volumes:
      - .:/app

volumes:
  postgres_data:
  insightface_model_cache:

networks:
  insightface_network:
    driver: bridge
